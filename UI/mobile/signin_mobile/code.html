<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        
        /* Smooth scale for buttons */
        .btn-interact {
            transition: transform 0.1s ease;
        }
        .btn-interact:active {
            transform: scale(0.96);
        }

        /* Glassmorphism utility */
        .glass {
            background: rgba(252, 249, 248, 0.8);
            backdrop-filter: blur(10px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body-md overflow-x-hidden min-h-screen flex flex-col">
<!-- TopAppBar - Mandatory Component -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-margin-mobile h-16 bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-md border-b border-outline-variant/30">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" style="font-size: 24px;">explore</span>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim">Modern Explorer</h1>
</div>
<div class="flex items-center">
<!-- Navigation Suppression for Sign-In Flow as per instructions -->
</div>
</header>
<main class="flex-grow flex flex-col items-center justify-center pt-20 pb-10 px-margin-mobile">
<!-- Hero Illustration Area -->
<div class="w-full max-w-sm mb-lg flex flex-col items-center">
<div class="relative w-48 h-48 mb-xs">
<!-- ThreeJS/Shader Placeholder or Illustration -->
<div class="absolute inset-0 bg-primary-fixed-dim rounded-full opacity-20 animate-pulse"></div>
<div class="relative z-10 w-full h-full flex items-center justify-center">
<img class="w-40 h-40 object-contain drop-shadow-xl" data-alt="A stylized, modern 3D illustration of a vibrant orange compass and a minimalist paper airplane floating over a warm, abstract landscape. The style is clean, vector-based, with soft shadows and high-contrast 'Action Orange' accents against a light cream background. The lighting is soft and optimistic, representing a journey's beginning." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCe7xIgIqK_xu0tmTRSsy2pf5QCS7wExc9rzLJ-azCShb6QT09rIXd505zuCJR0mQYNFZdQVGFZRzON0gRGVauOvqxM23N1rQqIRNS1PIfYuYDnbPQaXCdtsvfSswPEVgVdkTwst1cXSpPWWJWV-LSP3BaPxs5DrfmVmppcvEGZ1X4Ff5IdvAiz_Ko9DUUn_V7ffhT7T8QmLYYZJRj8rSO3G2fJPGULq89eR0IctyFZvE9Yb9d1qAco"/>
</div>
</div>
<div class="text-center">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-xs">Welcome back</h2>
<p class="text-on-surface-variant font-body-md">Your next adventure is waiting for you.</p>
</div>
</div>
<!-- Login Form -->
<form class="w-full max-w-sm space-y-sm" onsubmit="event.preventDefault()">
<div class="space-y-base">
<label class="block font-label-md text-label-md text-on-surface-variant ml-1" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-low border border-outline-variant/30 rounded-xl focus:ring-2 focus:ring-primary-container focus:border-transparent outline-none transition-all placeholder:text-outline-variant" id="email" placeholder="explorer@travel.com" type="email"/>
</div>
</div>
<div class="space-y-base">
<label class="block font-label-md text-label-md text-on-surface-variant ml-1" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-low border border-outline-variant/30 rounded-xl focus:ring-2 focus:ring-primary-container focus:border-transparent outline-none transition-all placeholder:text-outline-variant" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="flex justify-end pt-base">
<button class="text-primary font-label-md text-label-md hover:underline decoration-2 underline-offset-4" type="button">Forgot Password?</button>
</div>
<button class="w-full py-4 bg-primary-container text-on-primary-container font-headline-md text-headline-md rounded-xl shadow-lg hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-md" type="submit">
                Sign In
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<!-- Social Login Divider -->
<div class="w-full max-w-sm flex items-center gap-sm my-lg">
<div class="h-[1px] flex-grow bg-outline-variant/30"></div>
<span class="font-label-sm text-label-sm text-outline-variant uppercase tracking-widest">or continue with</span>
<div class="h-[1px] flex-grow bg-outline-variant/30"></div>
</div>
<!-- Social Login Buttons -->
<div class="w-full max-w-sm grid grid-cols-2 gap-sm">
<button class="flex items-center justify-center gap-xs py-3 border-2 border-outline-variant/20 rounded-xl hover:bg-surface-container transition-colors btn-interact">
<img alt="Google" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC6wKO1Y-pgZRLG_W_XgfAqlzd6W1sM_hV4-TOv5qpQ7Zp5883I8LSFlQvCl9tTQ9MdOtRuWyDIF5aJZGBXW_Ahw_t5b1DvJCJ3MyHd0rHPfvXi6EjhULBl8ZJp171LnwMtKdTeUgbElLO1BaLA7VpH1s3A5FnS-SDKj8siwnErwZRCgNmN5hLatXEq6LDeM8c99dKnM7DRdwCs3iIHMWweQj_n3EQJaPLh35hCOhYcd3SuTM8cn9QO"/>
<span class="font-label-md text-label-md">Google</span>
</button>
<button class="flex items-center justify-center gap-xs py-3 border-2 border-outline-variant/20 rounded-xl hover:bg-surface-container transition-colors btn-interact">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">apps</span>
<span class="font-label-md text-label-md">Apple</span>
</button>
</div>
<!-- Bottom Sign-Up Link -->
<footer class="mt-xl text-center">
<p class="font-body-md text-on-surface-variant">
                Don't have an account? 
                <a class="text-primary font-bold ml-1 hover:underline underline-offset-4 decoration-2" href="#">Sign Up</a>
</p>
</footer>
</main>
<!-- Subtle Background Atmosphere (Optional Vanilla JS) -->
<div class="fixed pointer-events-none opacity-20 z-[-1] rounded-full blur-[100px] bg-primary-container w-[300px] h-[300px] left-[-100px] bottom-[-100px]" id="glow-orb"></div>
<script>
        // Micro-interaction: Mouse/Touch tracking for the subtle background glow
        document.addEventListener('mousemove', (e) => {
            const orb = document.getElementById('glow-orb');
            const x = e.clientX;
            const y = e.clientY;
            
            // Smoothly ease the orb towards the cursor
            orb.style.transform = `translate(${x * 0.05}px, ${y * 0.05}px)`;
        });

        // Form focus effects
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('.material-symbols-outlined').style.color = '#ab3600'; // primary
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('.material-symbols-outlined').style.color = '#8f7066'; // outline
            });
        });
    </script>
</body></html>
